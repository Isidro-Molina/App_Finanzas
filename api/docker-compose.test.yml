services:
  postgres_test:
    image: postgres:16-alpine
    container_name: finova_postgres_test
    environment:
      POSTGRES_USER: finova
      POSTGRES_PASSWORD: finova
      POSTGRES_DB: finova_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finova -d finova_test"]
      interval: 2s
      timeout: 3s
      retries: 15
